<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        <style>
            body {
                background-color: #121212; /* dark background */
                color: rgb(24, 28, 27);             /* light text */
            }
            input {

                background-color: #222;  /* box background */
                color: white;   
                     }         /* text inside input */
            html , 
            body {
                width :100% ;
                height :100% ;
            }

            #main {
                padding-inline: 30px;
                width : 100% ;
                height : 100% ;
                background-color: #222;

            }
            .card{
                width: 300px;
                margin-top: 40px;
                color : #fff ;
                border-radius : 10px ;
                display: inline-block ;
                padding :20px ;
                border: 1px solid #555;

            }

            .profile{
                width : 50px ;
                height: 50px ;
                border-radius: 50%;
                margin-bottom: 2px;
                overflow : hidden ;
            }
            .profile img{
                width : 100% ;
                height: 100% ;
                object-fit: cover ;
            }
            .card h3 {

                margin-top: 0;
                margin-bottom: 6px;

            }

            .card h5 {

                margin-top: 0;
                margin-bottom: 10px;

            }

            .card p {

                margin-top: 0;
                margin-bottom: 0;

            }
    </style>
</head>
<body>

        <div id="main">
            <form action="">
            <input type="text" placeholder="profile pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="occupation">
            <input type="text" placeholder="info">
            <input type="Submit">
        </form>

            
        </div>
    


<script src="card.js"></script>
</body>
</html>
