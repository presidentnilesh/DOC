<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Form UI</title>
    <link rel="stylesheet" href="project02.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="ui-wrapper">
        
        <div class="left-nav">
            <button id="addBtn" class="icon-btn">+</button>
            <button class="icon-btn">↑</button>
            <button class="icon-btn">↓</button>
        </div>

        <div class="profile-card">
            <div class="avatar">
                <svg viewBox="0 0 24 24" fill="#302e4d" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
                </svg>
            </div>
            <h2 class="name">Fatima Uma</h2>
            <div class="info-row">
                <span class="label">Home town</span>
                <span class="value">Singapore</span>
            </div>
            <div class="info-row">
                <span class="label">Bookings</span>
                <span class="value">3 times</span>
            </div>
            <div class="actions">
                <button class="btn-primary">
                    <svg class="phone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    Call
                </button>
                <button class="btn-secondary">Message</button>
            </div>
        </div>

        <div class="right-dots">
            <div class="dot black"></div>
            <div class="dot purple"></div>
            <div class="dot orange"></div>
            <div class="dot teal"></div>
        </div>

    </div>

    <div id="formModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeBtn" class="close-btn">&times;</button>
            <h2>New Call</h2>
            
            <form>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" placeholder="https://example.com/photo.jpg">
                </div>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter full name">
                </div>
                
                <div class="form-group">
                    <label>Home Town</label>
                    <input type="text" placeholder="Enter home town">
                </div>
                
                <div class="form-group">
                    <label>Purpose</label>
                    <input type="text" placeholder="e.g., Quick appointment note">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <div class="category-options">
                        <label class="category-pill border-gray">
                            <input type="checkbox"> Emergency
                        </label>
                        <label class="category-pill border-red">
                            <input type="checkbox"> Important
                        </label>
                        <label class="category-pill border-purple">
                            <input type="checkbox"> Urgent
                        </label>
                        <label class="category-pill border-gray">
                            <input type="checkbox"> No Rush
                        </label>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="project02.js"></script>
</body>
</html>
